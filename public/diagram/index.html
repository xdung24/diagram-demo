<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Diagram MCP Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .preview-shell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
    }
    .preview-image {
      max-width: 100%;
      max-height: 100%;
      transform-origin: center center;
      transition: transform 0.2s ease;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .preview-image.is-dragging {
      cursor: grabbing;
    }
    .preview-toolbar {
      position: absolute;
      top: 4px;
      right: 10px;
      display: flex;
      gap: 4px;
      z-index: 10;
    }
    .preview-toolbar button {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid rgba(15, 23, 42, 0.16);
      background: rgba(255, 255, 255, 0.92);
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
      cursor: pointer;
      padding: 0;
      transition: transform 0.2s ease, background-color 0.2s ease;
      position: relative;
    }
    .preview-toolbar button:hover {
      transform: translateY(-1px);
      background: #f8fafc;
    }
    .preview-toolbar button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }
    .preview-toolbar button::after {
      content: attr(data-tooltip);
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      font-size: 11px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .preview-toolbar button:hover::after {
      opacity: 1;
    }
    .output-shell:fullscreen {
      background: #fff;
      color: #0f172a;
      padding: 1rem;
    }
    .output-shell:fullscreen .preview-shell {
      min-height: calc(100vh - 2rem);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto p-6 space-y-6">
    <header class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <div>
        <a href="/"><h1 class="text-2xl font-semibold">Diagram MCP Demo</h1></a>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-sm text-slate-400">Generate your diagram with AI</span>
      </div>
    </header>

    <section class="grid gap-6 lg:grid-cols-[minmax(320px,0.95fr)_minmax(380px,1.05fr)]">
      <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-lg font-semibold" id="detailTitle">Editor</h2>
            <p class="text-xs text-slate-400" id="updatedAt">Updated at</p>
          </div>
          <div>
            <button type="button" id="saveBtn" class="rounded-lg bg-slate-600 px-3 py-2 text-sm font-medium hover:bg-slate-500">Save changes</button>
            <button type="button" id="deleteBtn" class="rounded-lg border border-rose-700 px-3 py-2 text-sm font-medium text-rose-200 hover:bg-rose-950/40">Delete</button>
          </div>
      </div>
        <form id="detailForm" class="space-y-3">
          <label class="block text-sm">
            <span class="mb-1 block text-slate-300">Description</span>
            <textarea id="detailDescription" rows="3" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm"></textarea>
          </label>
          <div class="flex flex-wrap gap-2">
            <button type="button" id="generateBtn" class="rounded-lg border border-slate-700 px-3 py-2 text-sm font-medium hover:bg-slate-800">Generate diagram</button>
          </div>
          <label class="block text-sm">
            <span class="mb-1 block text-slate-300">Diagram code</span>
            <textarea id="detailCode" rows="12" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 font-mono text-sm" spellcheck="false"></textarea>
          </label>
          <div class="flex flex-wrap gap-2">
            <button type="button" id="renderBtn" class="rounded-lg border border-slate-700 px-3 py-2 text-sm font-medium hover:bg-slate-800">Render preview</button>
          </div>
        </form>
      </div>

      <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-lg font-semibold">Preview</h2>
            <p class="text-xs text-slate-400">Rendered output for the current diagram.</p>
          </div>
        </div>
        <div id="output" class="output-shell min-h-[320px] rounded-lg border border-slate-800 bg-white p-3 text-slate-900 overflow-hidden"></div>
        <div id="downloadSvg" class="hidden">
          <a id="downloadSvgLink" href="#" download="diagram.svg" class="rounded-lg border border-slate-700 px-3 py-2 text-sm font-medium hover:bg-slate-800">Download SVG</a>
        </div>
        <div id="error" class="hidden rounded-lg border border-rose-800 bg-rose-950/40 p-3 text-sm text-rose-200"></div>
      </div>
    </section>

    <section class="rounded-xl border border-slate-800 bg-slate-900 p-4">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-lg font-semibold">Debugger</h2>
        <button id="toggleLogs" class="text-sm text-slate-400">Collapse</button>
      </div>
      <div id="logs" class="rounded-lg border border-slate-800 bg-slate-950 p-3 text-xs font-mono max-h-64 overflow-hidden"></div>
    </section>
  </div>

  <script>
    const outputEl = document.getElementById('output');
    const errorEl = document.getElementById('error');
    const logsEl = document.getElementById('logs');
    let zoomInBtn = null;
    let zoomOutBtn = null;
    let zoomResetBtn = null;
    let fullscreenBtn = null;
    let previewImage = null;
    let previewShell = null;
    let previewScale = 1;
    let previewOffsetX = 0;
    let previewOffsetY = 0;
    let isDraggingPreview = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragOriginX = 0;
    let dragOriginY = 0;
    
    function setError(text) {
      if (!text) {
        errorEl.classList.add('hidden');
        errorEl.textContent = '';
        return;
      }
      errorEl.classList.remove('hidden');
      errorEl.textContent = text;
      console.log('Error:', text);
    }

    function setPreviewButtonsEnabled(hasImage) {
      const enabled = Boolean(hasImage);
      if (zoomInBtn) {
        zoomInBtn.disabled = !enabled;
      }
      if (zoomOutBtn) {
        zoomOutBtn.disabled = !enabled;
      }
      if (zoomResetBtn) {
        zoomResetBtn.disabled = !enabled;
      }
      if (fullscreenBtn) {
        fullscreenBtn.disabled = !enabled;
      }
    }

    function updatePreviewZoom() {
      if (!previewImage) {
        return;
      }
      previewImage.style.transform = `translate(${previewOffsetX}px, ${previewOffsetY}px) scale(${previewScale})`;
    }

    function renderImagePreview(src, alt = 'Rendered diagram') {
      outputEl.innerHTML = `
        <div class="preview-shell">
          <div class="preview-toolbar">
            <button type="button" id="zoomInBtn" data-tooltip="Zoom in" aria-label="Zoom in">+</button>
            <button type="button" id="zoomOutBtn" data-tooltip="Zoom out" aria-label="Zoom out">−</button>
            <button type="button" id="zoomResetBtn" data-tooltip="Reset zoom" aria-label="Reset zoom">↺</button>
            <button type="button" id="fullscreenBtn" data-tooltip="Fullscreen" aria-label="Fullscreen">⤢</button>
          </div>
          <img src="${src}" alt="${alt}" class="preview-image" />
        </div>
      `;
      zoomInBtn = document.getElementById('zoomInBtn');
      zoomOutBtn = document.getElementById('zoomOutBtn');
      zoomResetBtn = document.getElementById('zoomResetBtn');
      fullscreenBtn = document.getElementById('fullscreenBtn');
      previewImage = outputEl.querySelector('.preview-image');
      previewShell = outputEl.querySelector('.preview-shell');
      attachPreviewControls();
      updatePreviewZoom();
      setPreviewButtonsEnabled(true);
    }

    function renderTextPreview(text) {
      outputEl.innerHTML = `<pre class="whitespace-pre-wrap text-sm">${text}</pre>`;
      setPreviewButtonsEnabled(false);
    }

    function zoomPreview(delta) {
      if (!previewImage) {
        return;
      }
      previewScale = Math.min(3, Math.max(0.5, previewScale + delta));
      updatePreviewZoom();
    }

    function resetPreviewZoom() {
      previewScale = 1;
      previewOffsetX = 0;
      previewOffsetY = 0;
      updatePreviewZoom();
    }

    async function togglePreviewFullscreen() {
      if (!document.fullscreenElement) {
        try {
          await outputEl.requestFullscreen();
        } catch (err) {
          setError('Unable to enter fullscreen');
        }
        return;
      }
      await document.exitFullscreen();
    }

    function handlePreviewPointerDown(event) {
      if (!previewImage || previewScale <= 1) {
        return;
      }
      isDraggingPreview = true;
      previewImage.classList.add('is-dragging');
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      dragOriginX = previewOffsetX;
      dragOriginY = previewOffsetY;
      event.preventDefault();
    }

    function handlePreviewPointerMove(event) {
      if (!isDraggingPreview || !previewImage || previewScale <= 1) {
        return;
      }
      previewOffsetX = dragOriginX + (event.clientX - dragStartX);
      previewOffsetY = dragOriginY + (event.clientY - dragStartY);
      updatePreviewZoom();
      event.preventDefault();
    }

    function stopPreviewDragging() {
      isDraggingPreview = false;
      if (previewImage) {
        previewImage.classList.remove('is-dragging');
      }
    }

    function attachPreviewControls() {
      if (!zoomInBtn || !zoomOutBtn || !zoomResetBtn || !fullscreenBtn) {
        return;
      }
      zoomInBtn.addEventListener('click', () => zoomPreview(0.25));
      zoomOutBtn.addEventListener('click', () => zoomPreview(-0.25));
      zoomResetBtn.addEventListener('click', resetPreviewZoom);
      fullscreenBtn.addEventListener('click', togglePreviewFullscreen);
      document.addEventListener('fullscreenchange', () => {
        if (!fullscreenBtn) {
          return;
        }
        fullscreenBtn.setAttribute('data-tooltip', document.fullscreenElement === outputEl ? 'Exit fullscreen' : 'Fullscreen');
        fullscreenBtn.setAttribute('aria-label', document.fullscreenElement === outputEl ? 'Exit fullscreen' : 'Fullscreen');
      });

      if (previewImage) {
        previewImage.addEventListener('pointerdown', handlePreviewPointerDown);
        window.addEventListener('pointermove', handlePreviewPointerMove);
        window.addEventListener('pointerup', stopPreviewDragging);
        window.addEventListener('pointerleave', stopPreviewDragging);
      }
    }

    async function requestJson(path, options = {}) {
      const res = await fetch(path, options);
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || 'Request failed');
      }
      return data;
    }
  
    // Load diagram
    async function loadDiagram() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts.length > 1 ? pathParts[1] : '';
      if (!slug) {
        setError('Invalid diagram slug');
        return;
      }
      setError('');
      try {
        const item = await requestJson(`/api/diagram/${encodeURIComponent(slug)}`);
        document.getElementById('detailTitle').textContent = item.title || '';
        const updatedAt = new Date(item.updatedAt) || new Date();
        document.getElementById('updatedAt').textContent = `${updatedAt.toLocaleString()}`;
        document.getElementById('detailDescription').value = item.description || '';
        document.getElementById('detailCode').value = item.code || '';
        if (item.svgPath) {
          renderImagePreview(item.svgPath, 'Rendered diagram');
          document.getElementById('downloadSvg').classList.remove('hidden');
          document.getElementById('downloadSvgLink').href = item.svgPath;
        } else {
          renderTextPreview('No preview available yet.');
          document.getElementById('downloadSvg').classList.add('hidden');
        }
      } catch (err) {
        setError(err.message);
      }
    }
    loadDiagram();

    // Save button
    async function saveDiagram() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts.length > 1 ? pathParts[1] : '';
      setError('');
      try {
        await requestJson(`/api/diagram/${encodeURIComponent(slug)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            description: document.getElementById('detailDescription').value.trim(),
            code: document.getElementById('detailCode').value.trim(),
          }),
        });
      } catch (err) {
      }
    };
    document.getElementById('saveBtn').addEventListener('click', saveDiagram);

    // Generate button
    async function generateDiagram() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts.length > 1 ? pathParts[1] : '';
      const description = document.getElementById('detailDescription').value.trim();
      if (!description) {
        setError('Add a description first');
        return;
      }
      setError('');
      try {
        const data = await requestJson('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ description }),
        });
        const result = data.generatedCode || '';
        document.getElementById('detailCode').value = result;
      } catch (err) {
        setError(err.message);
      }
      renderDiagram();
    };
    document.getElementById('generateBtn').addEventListener('click', generateDiagram);
    
    // Render button
    async function renderDiagram() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts.length > 1 ? pathParts[1] : '';
      const code = document.getElementById('detailCode').value;
      if (!code.trim()) {
        setError('Add some diagram code first');
        return;
      }
      setError('');
      try {
        const data = await requestJson('/api/render', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tool: 'generate_diagram', code, params: {'name': `${encodeURIComponent(slug)}` } }),
        });
        const result = data.result || {};
        if (result.svgPath) {
          renderImagePreview(result.svgPath, 'Rendered diagram');
          document.getElementById('downloadSvg').classList.remove('hidden');
          document.getElementById('downloadSvgLink').href = result.svgPath;
        } else if (typeof result === 'string') {
          renderTextPreview(result);
        } else {
          renderTextPreview('Preview generated.');
        }
      } catch (err) {
        setError(err.message);
      }
    };
    document.getElementById('renderBtn').addEventListener('click', renderDiagram);

    // Delete button
    async function deleteDiagram() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts.length > 1 ? pathParts[1] : '';
      if (confirm("Are you sure you want to delete this diagram?")) {
        try {
          await requestJson(`/api/diagram/${encodeURIComponent(slug)}`, { method: 'DELETE' });
          window.location.href = '/';
        } catch (err) {
          setError(err.message);
        }
      }
    };
    document.getElementById('deleteBtn').addEventListener('click', deleteDiagram);

    // Debugger
    function appendLog(text) {
      const row = document.createElement('div');
      row.textContent = text;
      logsEl.prepend(row);
      if (logsEl.children.length > 100) {
        logsEl.removeChild(logsEl.lastChild);
      }
    }
    const eventSource = new EventSource('/api/logs/stream');
    eventSource.onerror = () => setError('Connection issue');
    eventSource.onmessage = (ev) => {
      appendLog(ev.data);
    };
  </script>
	</body>
</html>

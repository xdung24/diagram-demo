<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Diagram MCP Demo - Create new diagrams, manage your list, and open a detail view whenever you want to update or delete an entry.">
		<title>Diagram MCP Demo</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="/tailwindcss.js"></script>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .preview-shell {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 100%;
        overflow: hidden;
      }
      .preview-image {
        max-width: 100%;
        max-height: 100%;
        transform-origin: center center;
        transition: transform 0.2s ease;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      .preview-image.is-dragging {
        cursor: grabbing;
      }
      .preview-toolbar {
        position: absolute;
        top: 4px;
        right: 10px;
        display: flex;
        gap: 4px;
        z-index: 10;
      }
      .preview-toolbar button {
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        border: 1px solid rgba(15, 23, 42, 0.16);
        background: rgba(255, 255, 255, 0.92);
        color: #0f172a;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
        cursor: pointer;
        padding: 0;
        transition: transform 0.2s ease, background-color 0.2s ease;
        position: relative;
      }
      .preview-toolbar button:hover {
        transform: translateY(-1px);
        background: #f8fafc;
      }
      .preview-toolbar button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        box-shadow: none;
      }
      .preview-toolbar button::after {
        content: attr(data-tooltip);
        position: absolute;
        top: calc(100% + 6px);
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.9);
        color: #fff;
        font-size: 11px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      .preview-toolbar button:hover::after {
        opacity: 1;
      }
      .output-shell:fullscreen {
        background: #fff;
        color: #0f172a;
        padding: 1rem;
      }
      .output-shell:fullscreen .preview-shell {
        min-height: calc(100vh - 2rem);
      }
      .action-btn {
        transition: opacity 0.2s ease, transform 0.2s ease, background-color 0.2s ease;
      }
      .action-btn.is-loading {
        opacity: 0.85;
        cursor: wait;
        transform: scale(0.98);
      }
      .action-btn .btn-spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        margin-right: 8px;
        vertical-align: text-bottom;
        border: 2px solid rgba(255, 255, 255, 0.28);
        border-top-color: currentColor;
        border-radius: 999px;
        animation: spin 0.8s linear infinite;
      }
      .loading-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: inherit;
        background: rgba(2, 6, 23, 0.72);
        backdrop-filter: blur(2px);
        z-index: 30;
      }
      .loading-overlay.hidden {
        display: none;
      }
      .loading-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.7rem;
        min-width: 180px;
        padding: 1rem 1.2rem;
        border-radius: 0.9rem;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(15, 23, 42, 0.95);
        color: #e2e8f0;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.28);
      }
      .loading-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(148, 163, 184, 0.28);
        border-top-color: #38bdf8;
        border-radius: 999px;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto p-6 space-y-6">
    <div id="editorLoadingOverlay" class="loading-overlay hidden" aria-hidden="true">
      <div class="loading-card">
        <div class="loading-spinner"></div>
        <p id="editorLoadingMessage" class="text-sm font-medium">Loading diagram...</p>
      </div>
    </div>
    
    <header class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between" role="navigation">
      <div>
        <a href="/"><h1 class="text-2xl font-semibold">Diagram MCP Demo</h1></a>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-sm text-slate-400">Generate your diagram with AI</span>
      </div>
    </header>

    <section class="grid gap-6 lg:grid-cols-[minmax(320px,0.95fr)_minmax(380px,1.05fr)]" role="main">
      <div id="editorPanel" class="relative rounded-xl border border-slate-800 bg-slate-900 p-5 space-y-4" aria-busy="false">

        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-lg font-semibold" id="detailTitle">Editor</h2>
            <p class="text-xs text-slate-400" id="updatedAt">Updated at</p>
          </div>
          <div>
            <button type="button" id="saveBtn" class="action-btn rounded-lg bg-slate-600 px-3 py-2 text-sm font-medium hover:bg-slate-500">Save changes</button>
            <button type="button" id="deleteBtn" class="action-btn rounded-lg border border-rose-700 px-3 py-2 text-sm font-medium text-rose-200 hover:bg-rose-950/40">Delete</button>
          </div>
        </div>
        <form id="detailForm" class="space-y-3">
          <label class="block text-sm">
            <span class="mb-1 block text-slate-300">Description</span>
            <textarea id="detailDescription" rows="6" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm"></textarea>
          </label>
          <div class="flex flex-wrap gap-2">
            <button type="button" id="generateBtn" class="action-btn rounded-lg border border-slate-700 px-3 py-2 text-sm font-medium hover:bg-slate-800">Generate diagram</button>
          </div>
          <label class="block text-sm">
            <span class="mb-1 block text-slate-300">Diagram code</span>
            <textarea id="detailCode" rows="12" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 font-mono text-sm" spellcheck="false"></textarea>
          </label>
          <div class="flex flex-wrap gap-2">
            <button type="button" id="renderBtn" class="action-btn rounded-lg border border-slate-700 px-3 py-2 text-sm font-medium hover:bg-slate-800">Render preview</button>
          </div>
        </form>
      </div>
      <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-lg font-semibold">Preview</h2>
            <p class="text-xs text-slate-400">Rendered output for the current diagram.</p>
          </div>
        </div>
        <div id="output" class="output-shell min-h-[320px] rounded-lg border border-slate-800 bg-white p-3 text-slate-900 overflow-hidden"></div>
        <div id="downloadSvg" class="hidden">
          <a id="downloadSvgLink" href="#" download="diagram.svg" class="rounded-lg border border-slate-700 px-3 py-2 text-sm font-medium hover:bg-slate-800">Download SVG</a>
        </div>
      </div>
    </section>

    <div id="error" class="hidden flex items-center justify-between gap-2 rounded-lg border border-rose-800 bg-rose-950/40 p-3 text-sm text-rose-200">
      <span id="error-text"></span>
      <button 
        type="button" 
        onclick="document.getElementById('error').classList.add('hidden')" 
        class="rounded-md p-1 hover:bg-rose-900/50 focus:outline-none focus:ring-2 focus:ring-rose-500"
        aria-label="Clear error"
      >
        <svg class="h-4 w-4 stroke-rose-200" fill="none" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <section class="rounded-xl border border-slate-800 bg-slate-900 p-4">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-lg font-semibold">Debugger</h2>
        <button id="toggleLogs" class="text-sm text-slate-400">Collapse</button>
      </div>
      <div id="logs" class="rounded-lg border border-slate-800 bg-slate-950 p-3 text-xs font-mono max-h-64 overflow-y-auto"></div>
    </section>
  </div>
  <script>
    const outputEl = document.getElementById('output');
    let zoomInBtn = null;
    let zoomOutBtn = null;
    let zoomResetBtn = null;
    let fullscreenBtn = null;
    let previewImage = null;
    let previewShell = null;
    let previewScale = 1;
    let previewOffsetX = 0;
    let previewOffsetY = 0;
    let isDraggingPreview = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragOriginX = 0;
    let dragOriginY = 0;
    const editorPanelEl = document.getElementById('editorPanel');
    const editorLoadingOverlay = document.getElementById('editorLoadingOverlay');
    const editorLoadingMessage = document.getElementById('editorLoadingMessage');
    const actionButtons = [
      document.getElementById('saveBtn'),
      document.getElementById('deleteBtn'),
      document.getElementById('generateBtn'),
      document.getElementById('renderBtn'),
    ];
    
    function setError(text) {
      const errorContainer = document.getElementById('error');
      const errorText = document.getElementById('error-text');
      if (!text) {
        errorContainer.classList.add('hidden');
        errorText.textContent = '';
        return;
      }
      errorContainer.classList.remove('hidden');
      errorText.textContent = text;
      console.log('Error:', text);
    }
    function setPreviewButtonsEnabled(hasImage) {
      const enabled = Boolean(hasImage);
      if (zoomInBtn) {
        zoomInBtn.disabled = !enabled;
      }
      if (zoomOutBtn) {
        zoomOutBtn.disabled = !enabled;
      }
      if (zoomResetBtn) {
        zoomResetBtn.disabled = !enabled;
      }
      if (fullscreenBtn) {
        fullscreenBtn.disabled = !enabled;
      }
    }
    function setEditorLoading(isLoading, message = 'Working...') {
      if (!editorPanelEl || !editorLoadingOverlay || !editorLoadingMessage) {
        return;
      }
      editorPanelEl.setAttribute('aria-busy', String(isLoading));
      editorLoadingMessage.textContent = message;
      editorLoadingOverlay.classList.toggle('hidden', !isLoading);
    }
    function setActionLoading(activeButton, isLoading, message = 'Working...') {
      actionButtons.forEach((button) => {
        if (!button) {
          return;
        }
        if (button === activeButton && isLoading) {
          button.dataset.originalText = button.dataset.originalText || button.textContent.trim();
          button.disabled = true;
          button.classList.add('is-loading');
          button.innerHTML = `<span class="btn-spinner"></span><span>${message}</span>`;
          return;
        }
        button.disabled = isLoading;
      });
      if (!isLoading) {
        actionButtons.forEach((button) => {
          if (!button) {
            return;
          }
          button.classList.remove('is-loading');
          if (button.dataset.originalText) {
            button.textContent = button.dataset.originalText;
          }
          button.disabled = false;
        });
      }
    }
    function updatePreviewZoom() {
      if (!previewImage) {
        return;
      }
      previewImage.style.transform = `translate(${previewOffsetX}px, ${previewOffsetY}px) scale(${previewScale})`;
    }
    function renderImagePreview(src, alt = 'Rendered diagram') {
      outputEl.innerHTML = `
        <div class="preview-shell">
          <div class="preview-toolbar">
            <button type="button" id="zoomInBtn" data-tooltip="Zoom in" aria-label="Zoom in">+</button>
            <button type="button" id="zoomOutBtn" data-tooltip="Zoom out" aria-label="Zoom out">−</button>
            <button type="button" id="zoomResetBtn" data-tooltip="Reset zoom" aria-label="Reset zoom">↺</button>
            <button type="button" id="fullscreenBtn" data-tooltip="Fullscreen" aria-label="Fullscreen">⤢</button>
          </div>
          <img src="${src}" alt="${alt}" class="preview-image" />
        </div>
      `;
      zoomInBtn = document.getElementById('zoomInBtn');
      zoomOutBtn = document.getElementById('zoomOutBtn');
      zoomResetBtn = document.getElementById('zoomResetBtn');
      fullscreenBtn = document.getElementById('fullscreenBtn');
      previewImage = outputEl.querySelector('.preview-image');
      previewShell = outputEl.querySelector('.preview-shell');
      attachPreviewControls();
      updatePreviewZoom();
      setPreviewButtonsEnabled(true);
    }
    function renderTextPreview(text) {
      outputEl.innerHTML = `<pre class="whitespace-pre-wrap text-sm">${text}</pre>`;
      setPreviewButtonsEnabled(false);
    }
    function zoomPreview(delta) {
      if (!previewImage) {
        return;
      }
      previewScale = Math.min(3, Math.max(0.5, previewScale + delta));
      updatePreviewZoom();
    }
    function resetPreviewZoom() {
      previewScale = 1;
      previewOffsetX = 0;
      previewOffsetY = 0;
      updatePreviewZoom();
    }
    async function togglePreviewFullscreen() {
      if (!document.fullscreenElement) {
        try {
          await outputEl.requestFullscreen();
        } catch (err) {
          setError('Unable to enter fullscreen');
        }
        return;
      }
      await document.exitFullscreen();
    }
    function handlePreviewPointerDown(event) {
      if (!previewImage || previewScale <= 1) {
        return;
      }
      isDraggingPreview = true;
      previewImage.classList.add('is-dragging');
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      dragOriginX = previewOffsetX;
      dragOriginY = previewOffsetY;
      event.preventDefault();
    }
    function handlePreviewPointerMove(event) {
      if (!isDraggingPreview || !previewImage || previewScale <= 1) {
        return;
      }
      previewOffsetX = dragOriginX + (event.clientX - dragStartX);
      previewOffsetY = dragOriginY + (event.clientY - dragStartY);
      updatePreviewZoom();
      event.preventDefault();
    }
    function stopPreviewDragging() {
      isDraggingPreview = false;
      if (previewImage) {
        previewImage.classList.remove('is-dragging');
      }
    }
    function attachPreviewControls() {
      if (!zoomInBtn || !zoomOutBtn || !zoomResetBtn || !fullscreenBtn) {
        return;
      }
      zoomInBtn.addEventListener('click', () => zoomPreview(0.25));
      zoomOutBtn.addEventListener('click', () => zoomPreview(-0.25));
      zoomResetBtn.addEventListener('click', resetPreviewZoom);
      fullscreenBtn.addEventListener('click', togglePreviewFullscreen);
      document.addEventListener('fullscreenchange', () => {
        if (!fullscreenBtn) {
          return;
        }
        fullscreenBtn.setAttribute('data-tooltip', document.fullscreenElement === outputEl ? 'Exit fullscreen' : 'Fullscreen');
        fullscreenBtn.setAttribute('aria-label', document.fullscreenElement === outputEl ? 'Exit fullscreen' : 'Fullscreen');
      });
      if (previewImage) {
        previewImage.addEventListener('pointerdown', handlePreviewPointerDown);
        window.addEventListener('pointermove', handlePreviewPointerMove);
        window.addEventListener('pointerup', stopPreviewDragging);
        window.addEventListener('pointerleave', stopPreviewDragging);
      }
    }
    async function requestJson(path, options = {}) {
      const res = await fetch(path, options);
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || 'Request failed');
      }
      return data;
    }
    async function loadDiagram() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts.length > 1 ? pathParts[1] : '';
      if (!slug) {
        setError('Invalid diagram slug');
        return;
      }
      setError('');
      setEditorLoading(true, 'Loading diagram...');
      setActionLoading(null, true, 'Loading...');
      try {
        const item = await requestJson(`/api/diagram/${encodeURIComponent(slug)}`);
        if(item.title) {
          document.getElementById('detailTitle').textContent = item.title ;
          document.title = `${item.title} - Diagram MCP Demo`;
          document.querySelector('meta[name="description"]').setAttribute('content', `${item.title} - Diagram MCP Demo`); 
        }
        const updatedAt = new Date(item.updatedAt) || new Date();
        document.getElementById('updatedAt').textContent = `${updatedAt.toLocaleString()}`;
        document.getElementById('detailDescription').value = item.description || '';
        document.getElementById('detailCode').value = item.code || '';
        if (item.svgPath) {
          renderImagePreview(item.svgPath, 'Rendered diagram');
          document.getElementById('downloadSvg').classList.remove('hidden');
          document.getElementById('downloadSvgLink').href = item.svgPath;
        } else {
          renderTextPreview('No preview available yet.');
          document.getElementById('downloadSvg').classList.add('hidden');
        }
      } catch (err) {
        setError(err.message);
      } finally {
        setEditorLoading(false);
        setActionLoading(null, false);
      }
    }
    loadDiagram();
    async function saveDiagram() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts.length > 1 ? pathParts[1] : '';
      setError('');
      setEditorLoading(true, 'Saving diagram...');
      setActionLoading(document.getElementById('saveBtn'), true, 'Saving...');
      try {
        await requestJson(`/api/diagram/${encodeURIComponent(slug)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            description: document.getElementById('detailDescription').value.trim(),
            code: document.getElementById('detailCode').value.trim(),
          }),
        });
      } catch (err) {
        setError(err.message);
      } finally {
        setEditorLoading(false);
        setActionLoading(document.getElementById('saveBtn'), false);
      }
    };
    document.getElementById('saveBtn').addEventListener('click', saveDiagram);
    async function generateDiagram() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts.length > 1 ? pathParts[1] : '';
      const description = document.getElementById('detailDescription').value.trim();
      if (!description) {
        setError('Add a description first');
        return;
      }
      setError('');
      setEditorLoading(true, 'Generating diagram...');
      setActionLoading(document.getElementById('generateBtn'), true, 'Generating...');
      try {
        const data = await requestJson('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ description }),
        });
        const result = data.generatedCode || '';
        document.getElementById('detailCode').value = result;
        await renderDiagram();
      } catch (err) {
        setError(err.message);
      } finally {
        setEditorLoading(false);
        setActionLoading(document.getElementById('generateBtn'), false);
      }
      saveDiagram();
    };
    document.getElementById('generateBtn').addEventListener('click', generateDiagram);
    async function renderDiagram() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts.length > 1 ? pathParts[1] : '';
      const code = document.getElementById('detailCode').value;
      if (!code.trim()) {
        setError('Add some diagram code first');
        return;
      }
      setError('');
      setEditorLoading(true, 'Rendering preview...');
      setActionLoading(document.getElementById('renderBtn'), true, 'Rendering...');
      try {
        const data = await requestJson('/api/render', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tool: 'generate_diagram', code, params: {'name': `${encodeURIComponent(slug)}` } }),
        });
        const result = data.result || {};
        if (result.svgPath) {
          renderImagePreview(result.svgPath, 'Rendered diagram');
          document.getElementById('downloadSvg').classList.remove('hidden');
          document.getElementById('downloadSvgLink').href = result.svgPath;
        } else if (typeof result === 'string') {
          renderTextPreview(result);
        } else {
          renderTextPreview('Preview generated.');
        }
      } catch (err) {
        setError(err.message);
      } finally {
        setEditorLoading(false);
        setActionLoading(document.getElementById('renderBtn'), false);
      }
    };
    document.getElementById('renderBtn').addEventListener('click', renderDiagram);
    async function deleteDiagram() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts.length > 1 ? pathParts[1] : '';
      if (confirm("Are you sure you want to delete this diagram?")) {
        try {
          await requestJson(`/api/diagram/${encodeURIComponent(slug)}`, { method: 'DELETE' });
          window.location.href = '/';
        } catch (err) {
          setError(err.message);
        }
      }
    };
    document.getElementById('deleteBtn').addEventListener('click', deleteDiagram);
    function appendLog(text) {
      const logsEl = document.getElementById('logs');
      const row = document.createElement('div');
      row.textContent = text;
      logsEl.prepend(row);
      if (logsEl.children.length > 100) {
        logsEl.removeChild(logsEl.lastChild);
      }
    }
    const eventSource = new EventSource('/api/logs/stream');
    eventSource.onerror = () => setError('Connection issue');
    eventSource.onmessage = (ev) => {
      appendLog(ev.data);
    };
    const toggleLogsBtn = document.getElementById('toggleLogs');
    const logsEl = document.getElementById('logs');
    toggleLogsBtn.addEventListener('click', () => {
      const isCollapsed = logsEl.classList.toggle('hidden');
      toggleLogsBtn.textContent = isCollapsed ? 'Expand' : 'Collapse';
    });
  </script>
	</body>
</html>

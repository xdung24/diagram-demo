<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Diagram MCP Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto p-6 space-y-6">
    <header class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <div>
        <h1 class="text-2xl font-semibold">Diagram detail</h1>
        <p class="text-sm text-slate-400">View, update, and delete a diagram from the /diagram route.</p>
      </div>
      <div class="flex items-center gap-2">
        <a href="/" class="rounded-lg border border-slate-700 px-3 py-2 text-sm font-medium text-slate-200 hover:bg-slate-800">Back to landing page</a>
        <span id="status" class="text-sm text-slate-400">Loading…</span>
      </div>
    </header>

    <section class="grid gap-6 lg:grid-cols-[minmax(320px,0.95fr)_minmax(380px,1.05fr)]">
      <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-lg font-semibold">Editor</h2>
            <p class="text-xs text-slate-400">Update the selected diagram content.</p>
          </div>
          <button id="deleteBtn" class="rounded-lg border border-rose-700 px-3 py-2 text-sm font-medium text-rose-200 hover:bg-rose-950/40">Delete</button>
        </div>

        <form id="detailForm" class="space-y-3">
          <label class="block text-sm">
            <span class="mb-1 block text-slate-300">Title</span>
            <input id="detailTitle" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm" required />
          </label>
          <label class="block text-sm">
            <span class="mb-1 block text-slate-300">Prompt</span>
            <textarea id="detailPrompt" rows="3" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm"></textarea>
          </label>
          <label class="block text-sm">
            <span class="mb-1 block text-slate-300">Diagram code</span>
            <textarea id="detailCode" rows="12" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 font-mono text-sm" spellcheck="false"></textarea>
          </label>
          <div class="flex flex-wrap gap-2">
            <button type="submit" class="rounded-lg bg-slate-600 px-3 py-2 text-sm font-medium hover:bg-slate-500">Save changes</button>
            <button type="button" id="renderBtn" class="rounded-lg border border-slate-700 px-3 py-2 text-sm font-medium hover:bg-slate-800">Render preview</button>
          </div>
        </form>
      </div>

      <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-lg font-semibold">Preview</h2>
            <p class="text-xs text-slate-400">Rendered output for the current diagram.</p>
          </div>
        </div>
        <div id="output" class="min-h-[320px] rounded-lg border border-slate-800 bg-white p-3 text-slate-900 overflow-auto"></div>
        <div id="error" class="hidden rounded-lg border border-rose-800 bg-rose-950/40 p-3 text-sm text-rose-200"></div>
      </div>
    </section>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');
    const errorEl = document.getElementById('error');

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setError(text) {
      if (!text) {
        errorEl.classList.add('hidden');
        errorEl.textContent = '';
        return;
      }
      errorEl.classList.remove('hidden');
      errorEl.textContent = text;
    }

    async function requestJson(path, options = {}) {
      const res = await fetch(path, options);
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || 'Request failed');
      }
      return data;
    }

    async function loadDiagram() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts.length > 1 ? pathParts[1] : '';
      const id = slug || new URLSearchParams(window.location.search).get('id');
      if (!id) {
        outputEl.innerHTML = '<div class="text-sm text-slate-600">Pick a diagram from the landing page or create a new one first.</div>';
        setStatus('No diagram selected');
        return;
      }
      setStatus('Loading…');
      try {
        const item = await requestJson(`/api/diagram/${encodeURIComponent(id)}`);
        document.getElementById('detailTitle').value = item.title || '';
        document.getElementById('detailPrompt').value = item.prompt || '';
        document.getElementById('detailCode').value = item.code || '';
        setStatus('Loaded');
      } catch (err) {
        setStatus(err.message);
      }
    }

    async function renderDiagram() {
      const code = document.getElementById('detailCode').value;
      if (!code.trim()) {
        setError('Add some diagram code first');
        return;
      }
      setStatus('Rendering…');
      try {
        const data = await requestJson('/api/render', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tool: 'generate_diagram', code, params: {} }),
        });
        const result = data.result || {};
        if (result.svgPath) {
          outputEl.innerHTML = `<img src="${result.svgPath}" alt="Rendered diagram" class="max-w-full" />`;
        } else if (typeof result === 'string') {
          outputEl.innerHTML = `<pre class="whitespace-pre-wrap text-sm">${result}</pre>`;
        } else {
          outputEl.innerHTML = '<div class="text-sm text-slate-600">Preview generated.</div>';
        }
        setError('');
        setStatus('Ready');
      } catch (err) {
        setError(err.message);
        setStatus('Error');
      }
    }

    document.getElementById('detailForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts.length > 1 ? pathParts[1] : '';
      const id = slug || new URLSearchParams(window.location.search).get('id');
      if (!id) {
        setStatus('Select a diagram first');
        return;
      }
      setStatus('Saving…');
      try {
        await requestJson(`/api/diagram/${encodeURIComponent(id)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: document.getElementById('detailTitle').value.trim(),
            prompt: document.getElementById('detailPrompt').value.trim(),
            code: document.getElementById('detailCode').value.trim(),
          }),
        });
        setStatus('Saved');
      } catch (err) {
        setStatus(err.message);
      }
    });

    document.getElementById('renderBtn').addEventListener('click', renderDiagram);
    document.getElementById('deleteBtn').addEventListener('click', async () => {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts.length > 1 ? pathParts[1] : '';
      const id = slug || new URLSearchParams(window.location.search).get('id');
      if (!id) {
        setStatus('No diagram selected');
        return;
      }
      try {
        await requestJson(`/api/diagram/${encodeURIComponent(id)}`, { method: 'DELETE' });
        window.location.href = '/';
      } catch (err) {
        setStatus(err.message);
      }
    });

    loadDiagram();
  </script>
</body>
</html>

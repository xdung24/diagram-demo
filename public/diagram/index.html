<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Diagram MCP Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto p-6 space-y-6">
    <header class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <div>
        <a href="/"><h1 class="text-2xl font-semibold">Diagram MCP Demo</h1></a>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-sm text-slate-400">Generate your diagram with AI</span>
      </div>
    </header>

    <section class="grid gap-6 lg:grid-cols-[minmax(320px,0.95fr)_minmax(380px,1.05fr)]">
      <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-lg font-semibold" id="detailTitle">Editor</h2>
            <p class="text-xs text-slate-400" id="updatedAt">Updated at</p>
          </div>
          <div>
            <button type="button" id="saveBtn" class="rounded-lg bg-slate-600 px-3 py-2 text-sm font-medium hover:bg-slate-500">Save changes</button>
            <button type="button" id="deleteBtn" class="rounded-lg border border-rose-700 px-3 py-2 text-sm font-medium text-rose-200 hover:bg-rose-950/40">Delete</button>
          </div>
      </div>
        <form id="detailForm" class="space-y-3">
          <label class="block text-sm">
            <span class="mb-1 block text-slate-300">Description</span>
            <textarea id="detailDescription" rows="3" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm"></textarea>
          </label>
          <div class="flex flex-wrap gap-2">
            <button type="button" id="generateBtn" class="rounded-lg border border-slate-700 px-3 py-2 text-sm font-medium hover:bg-slate-800">Generate diagram</button>
          </div>
          <label class="block text-sm">
            <span class="mb-1 block text-slate-300">Diagram code</span>
            <textarea id="detailCode" rows="12" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 font-mono text-sm" spellcheck="false"></textarea>
          </label>
          <div class="flex flex-wrap gap-2">
            <button type="button" id="renderBtn" class="rounded-lg border border-slate-700 px-3 py-2 text-sm font-medium hover:bg-slate-800">Render preview</button>
          </div>
        </form>
      </div>

      <div class="rounded-xl border border-slate-800 bg-slate-900 p-5 space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-lg font-semibold">Preview</h2>
            <p class="text-xs text-slate-400">Rendered output for the current diagram.</p>
          </div>
        </div>
        <div id="output" class="min-h-[320px] rounded-lg border border-slate-800 bg-white p-3 text-slate-900 overflow-auto"></div>
        <div id="error" class="hidden rounded-lg border border-rose-800 bg-rose-950/40 p-3 text-sm text-rose-200"></div>
      </div>
    </section>

    <section class="rounded-xl border border-slate-800 bg-slate-900 p-4">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-lg font-semibold">Debugger</h2>
        <button id="toggleLogs" class="text-sm text-slate-400">Collapse</button>
      </div>
      <div id="logs" class="rounded-lg border border-slate-800 bg-slate-950 p-3 text-xs font-mono max-h-64 overflow-auto"></div>
    </section>
  </div>

  <script>
    const outputEl = document.getElementById('output');
    const errorEl = document.getElementById('error');
    const logsEl = document.getElementById('logs');
    
    function setError(text) {
      if (!text) {
        errorEl.classList.add('hidden');
        errorEl.textContent = '';
        return;
      }
      errorEl.classList.remove('hidden');
      errorEl.textContent = text;
      console.log('Error:', text);
    }

    async function requestJson(path, options = {}) {
      const res = await fetch(path, options);
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || 'Request failed');
      }
      return data;
    }

    // Save button
    async function saveDiagram() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts.length > 1 ? pathParts[1] : '';
      setError('');
      try {
        await requestJson(`/api/diagram/${encodeURIComponent(slug)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            description: document.getElementById('detailDescription').value.trim(),
            code: document.getElementById('detailCode').value.trim(),
          }),
        });
      } catch (err) {
      }
    };
    document.getElementById('saveBtn').addEventListener('click', saveDiagram);

    // Generate button
    async function generateDiagram() {
      const description = document.getElementById('detailDescription').value.trim();
      if (!description) {
        setError('Add a description first');
        return;
      }
      setError('');
      try {
        const data = await requestJson('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ description }),
        });
        const result = data.generatedCode || '';
        document.getElementById('detailCode').value = result;
      } catch (err) {
        setError(err.message);
      }
    };
    document.getElementById('generateBtn').addEventListener('click', generateDiagram);
    
    // Render button
    async function renderDiagram() {
      const code = document.getElementById('detailCode').value;
      if (!code.trim()) {
        setError('Add some diagram code first');
        return;
      }
      setError('');
      try {
        const data = await requestJson('/api/render', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tool: 'generate_diagram', code, params: {} }),
        });
        const result = data.result || {};
        if (result.svgPath) {
          outputEl.innerHTML = `<img src="${result.svgPath}" alt="Rendered diagram" class="max-w-full" />`;
        } else if (typeof result === 'string') {
          outputEl.innerHTML = `<pre class="whitespace-pre-wrap text-sm">${result}</pre>`;
        } else {
          outputEl.innerHTML = '<div class="text-sm text-slate-600">Preview generated.</div>';
        }
      } catch (err) {
        setError(err.message);
      }
    };
    document.getElementById('renderBtn').addEventListener('click', renderDiagram);

    // Delete button
    async function deleteDiagram() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts.length > 1 ? pathParts[1] : '';
      if (confirm("Are you sure you want to delete this diagram?")) {
        try {
          await requestJson(`/api/diagram/${encodeURIComponent(slug)}`, { method: 'DELETE' });
          window.location.href = '/';
        } catch (err) {
          setError(err.message);
        }
      }
    };
    document.getElementById('deleteBtn').addEventListener('click', deleteDiagram);

    async function loadDiagram() {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts.length > 1 ? pathParts[1] : '';
      const id = slug || new URLSearchParams(window.location.search).get('id');
      if (!id) {
        outputEl.innerHTML = '<div class="text-sm text-slate-600">Pick a diagram from the landing page or create a new one first.</div>';
        return;
      }
      setError('');
      try {
        const item = await requestJson(`/api/diagram/${encodeURIComponent(id)}`);
        document.getElementById('detailTitle').textContent = item.title || '';
        const updatedAt = new Date(item.updatedAt) || new Date();
        document.getElementById('updatedAt').textContent = `${updatedAt.toLocaleString()}`;
        document.getElementById('detailDescription').value = item.description || '';
        document.getElementById('detailCode').value = item.code || '';
      } catch (err) {
        setError(err.message);
      }
    }

    loadDiagram();

    function appendLog(text) {
      const row = document.createElement('div');
      row.textContent = text;
      logsEl.prepend(row);
      if (logsEl.children.length > 100) {
        logsEl.removeChild(logsEl.lastChild);
      }
    }
    const eventSource = new EventSource('/api/logs/stream');
    eventSource.onerror = () => setError('Connection issue');
    eventSource.onmessage = (ev) => {
      appendLog(ev.data);
    };
  </script>
	</body>
</html>

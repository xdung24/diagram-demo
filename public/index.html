<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Diagram MCP Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto p-6 space-y-6">
    <header class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <div>
        <h1 class="text-2xl font-semibold">Diagram MCP Demo</h1>
        <p class="text-sm text-slate-400">Create new diagrams, manage your list, and open a detail view whenever you want to update or delete an entry.</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <span id="createStatus" class="text-sm text-slate-400"></span>
        <button id="openCreateDialog" type="button" class="rounded-lg bg-slate-600 px-3 py-2 text-sm font-medium hover:bg-slate-500">New diagram</button>
      </div>
    </header>

    <section class="rounded-xl border border-slate-800 bg-slate-900 p-5 space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-lg font-semibold">Your diagrams</h2>
          <p class="text-xs text-slate-400">Select any item to open the detail page at /diagram.</p>
        </div>
        <button id="refreshBtn" class="text-sm text-slate-400 hover:text-slate-200">Refresh</button>
      </div>
      <div id="diagramList" class="space-y-3"></div>
    </section>

    <div id="createDialog" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/80 p-4">
      <div class="w-full max-w-xl rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-2xl">
        <div class="flex items-start justify-between gap-4">
          <div>
            <h2 class="text-lg font-semibold">Create diagram</h2>
            <p class="text-xs text-slate-400">Save a new Mermaid diagram to your list.</p>
          </div>
          <button id="closeCreateDialog" type="button" class="rounded-lg border border-slate-700 px-3 py-2 text-sm text-slate-300 hover:bg-slate-800">Close</button>
        </div>

        <form id="createForm" class="mt-4 space-y-3">
          <label class="block text-sm">
            <span class="mb-1 block text-slate-300">Title</span>
            <input id="title" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm" placeholder="My new workflow" required />
          </label>
          <label class="block text-sm">
            <span class="mb-1 block text-slate-300">Description</span>
            <textarea id="description" rows="3" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm" placeholder="Describe what the diagram should show"></textarea>
          </label>
          <div class="flex flex-wrap gap-2">
            <button type="submit" class="rounded-lg bg-slate-600 px-3 py-2 text-sm font-medium hover:bg-slate-500">Create diagram</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const listEl = document.getElementById('diagramList');
    const createStatusEl = document.getElementById('createStatus');
    const createDialogEl = document.getElementById('createDialog');
    const openCreateDialogBtn = document.getElementById('openCreateDialog');
    const closeCreateDialogBtn = document.getElementById('closeCreateDialog');

    function setStatus(text) {
      createStatusEl.textContent = text;
    }

    function openCreateDialog() {
      createDialogEl.classList.remove('hidden');
      createDialogEl.classList.add('flex');
      document.getElementById('title').focus();
    }

    function closeCreateDialog() {
      createDialogEl.classList.add('hidden');
      createDialogEl.classList.remove('flex');
    }

    async function requestJson(path, options = {}) {
      const res = await fetch(path, options);
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || 'Request failed');
      }
      return data;
    }

    function renderList(diagrams) {
      if (!diagrams.length) {
        listEl.innerHTML = '<div class="rounded-lg border border-dashed border-slate-700 p-4 text-sm text-slate-400">No diagrams yet. Create one to get started.</div>';
        return;
      }

      listEl.innerHTML = diagrams.map((item) => `
        <article class="rounded-lg border border-slate-800 bg-slate-950/70 p-4">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h3 class="font-medium">${item.title}</h3>
              <p class="mt-1 text-sm text-slate-400">${(item.description || '').slice(0, 100) || 'No description provided.'}</p>
            </div>
            <span class="rounded-full bg-slate-800 px-2.5 py-1 text-[11px] uppercase tracking-wide text-slate-400">${new Date(item.updatedAt || item.createdAt).toLocaleDateString()}</span>
          </div>
          <div class="mt-3 flex flex-wrap gap-2">
            <a href="/diagram/${encodeURIComponent(item.slug || item.id)}" class="rounded-lg bg-slate-700 px-3 py-2 text-sm font-medium hover:bg-slate-600">View</a>
          </div>
        </article>
      `).join('');
    }

    async function loadDiagrams() {
      try {
        const data = await requestJson('/api/diagrams');
        renderList(data.diagrams || []);
      } catch (err) {
        setStatus(err.message);
      }
    }

    document.getElementById('createForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      setStatus('Creating…');
      try {
        const payload = {
          title: document.getElementById('title').value.trim(),
          description: document.getElementById('description').value.trim(),
          code: '',
        };
        const created = await requestJson('/api/diagrams', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        setStatus('Created');
        document.getElementById('createForm').reset();
        closeCreateDialog();
        window.location.href = `/diagram/${encodeURIComponent(created.slug || created.id)}`;
      } catch (err) {
        setStatus(err.message);
      }
    });

    openCreateDialogBtn.addEventListener('click', openCreateDialog);
    closeCreateDialogBtn.addEventListener('click', closeCreateDialog);
    createDialogEl.addEventListener('click', (event) => {
      if (event.target === createDialogEl) {
        closeCreateDialog();
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeCreateDialog();
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', loadDiagrams);
    loadDiagrams();
  </script>
</body>
</html>
